<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- SEO -->
    <title>PixelBooth</title>
    <meta
      name="description"
      content="Sistem photobooth profesional berbasis web. Terintegrasi dengan DSLR, template dinamis, galeri foto, dan QR code delivery."
    />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="PixelBooth" />

    <!-- Open Graph -->
    <meta property="og:title" content="PixelBooth" />
    <meta
      property="og:description"
      content="Sistem photobooth profesional berbasis web."
    />
    <meta property="og:type" content="website" />

    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Early Theme Execution — Mencegah Flicker/Mismatch Warna Saat Awal Akses -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pb-theme');
          var isLight = t === 'light';
          if (isLight) {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
          }
          // Warna chrome browser harus sinkron sejak paint pertama
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isLight ? '#FFFFFF' : '#0A0A0A');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-pb-bg text-pb-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
