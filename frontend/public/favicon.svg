<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pb-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="pb-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#pb-bg)" stroke="url(#pb-ring)" stroke-width="14" />

  <!-- Camera Body -->
  <path d="M144 200 C144 176, 168 160, 192 160 L220 160 L236 136 L276 136 L292 160 L320 160 C344 160, 368 176, 368 200 L368 328 C368 352, 344 368, 320 368 L192 368 C168 368, 144 352, 144 328 Z" 
        fill="none" stroke="url(#pb-ring)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="264" r="68" fill="none" stroke="url(#pb-ring)" stroke-width="18" />

  <!-- Inner Lens Aperture -->
  <circle cx="256" cy="264" r="30" fill="url(#pb-lens)" />

  <!-- Flash / LED Indicator -->
  <circle cx="330" cy="200" r="14" fill="#22d3ee" />
</svg>